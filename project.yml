name: Companion
options:
  bundleIdPrefix: de.oliveradler
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
targets:
  Companion:
    type: application
    platform: iOS
    sources:
      - Sources/Companion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.oliveradler.companion
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Companion
        INFOPLIST_KEY_NSFaceIDUsageDescription: Face ID schützt deinen privaten Chat und dein Gedächtnis.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
schemes:
  Companion:
    build:
      targets:
        Companion: all
